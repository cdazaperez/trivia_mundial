version: "3.8"

services:
  backend:
    build: ./backend
    container_name: trivia-backend
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-me-in-production}
      - DATABASE_URL=sqlite:////data/trivia_mundial.db
      - CORS_ORIGINS=*
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@triviamundial.com}
      - ADMIN_FULLNAME=${ADMIN_FULLNAME:-Administrador}
    volumes:
      - db-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: trivia-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:${APP_PORT:-82}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
    driver: local
